[project]
name = "erm-itc"
version = "0.1.0"
description = "TRM (Tiny Recursive Model) for ITC2007 CB-CTT timetabling instances -- data pipeline and model"
requires-python = ">=3.11"
dependencies = [
    "torch",
    "numpy",
    "pydantic",
    "ortools",
    "scipy",
    "wandb",
    "pyyaml",
    "tqdm",
]

[tool.uv]
package = false

# PyPI's default torch wheel needs a newer CUDA runtime than some drivers
# support (silent fallback to CPU); pin to cu124 on Linux instead.
[tool.uv.sources]
torch = [{ index = "pytorch-cu124", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true
