[project]
name = "erm-itc"
version = "0.1.0"
description = "TRM for ITC2007 curriculum-based course timetabling"
requires-python = ">=3.11"
dependencies = [
    "torch",
    "numpy",
    "ortools",
    "wandb",
    "pyyaml",
    "tqdm",
]

[tool.uv]
package = false

[tool.uv.sources]
torch = [{ index = "pytorch-cu124", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true
